services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: processcanvas
      POSTGRES_USER: processcanvas
      POSTGRES_PASSWORD: processcanvas
    ports:
      - "5432:5432"
    volumes:
      - processcanvas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U processcanvas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  processcanvas_postgres:
